<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Dantá &amp; Desrica Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--card:#18181b;--card2:#202024;--line:#2c2c31;--txt:#f3f3f4;--mut:#9b9ba3;--acc:#ef3b3e;--acc2:#ff6b5e;--ok:#3ecf8e;--warn:#f5b942;
 --onacc:#fff;--dim:#5a5a62;--navbg:rgba(18,18,20,.97);--bannerbg:linear-gradient(135deg,#3a1415,#1e1112);--bannerline:#5a2224;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--nav:62px;--bebas:'Bebas Neue',Impact,'Arial Narrow',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);transition:background .3s;color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt)}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + var(--st)) 14px calc(var(--nav) + var(--sb) + 110px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header>div:first-child{min-width:0;overflow:hidden}
header .row{flex:none;gap:6px}
h1{white-space:nowrap;font-family:var(--bebas);font-weight:400;font-size:clamp(26px,8vw,34px);letter-spacing:1px;margin:0;line-height:1}
h1 span{color:var(--acc)}
.sync{font-size:11px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--acc)}.sync.busy i{background:var(--warn)}
.pill{white-space:nowrap;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.tab{display:none}.tab.on{display:block}
.days{display:flex;gap:6px;margin:14px 0 6px;overflow-x:auto}
.days button{flex:1;min-width:58px;padding:9px 0 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;position:relative}
.days button small{display:block;font-weight:500;font-size:10px;color:var(--mut);margin-top:2px}
.days button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.days button.on small{color:var(--onacc);opacity:.75}
.days button.today:not(.on){border-color:var(--acc2)}
.days button .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.weekline{font-size:12px;color:var(--mut);text-align:center;margin:6px 0 0}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 2px 10px;gap:10px}
.dayhead h2{font-family:var(--bebas);font-weight:400;font-size:28px;margin:0;letter-spacing:.5px;line-height:1}
.dayhead .sub{font-size:12px;color:var(--mut);margin-top:3px}
.dayhead .prog{font-size:12px;color:var(--mut);white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.done{border-color:#2f6b52}
.card h3{font-family:var(--bebas);font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:.5px}
.top{display:flex;gap:12px}
.top .info{flex:1;min-width:0}
.num{font-size:11px;color:var(--acc2);font-weight:700;letter-spacing:.5px}
.name{font-weight:700;font-size:17px;margin:2px 0 4px;line-height:1.2}
.meta{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta b{color:var(--txt);font-weight:600}
.thumb{width:86px;height:86px;flex:none;background:var(--card2);border-radius:14px;border:1px solid var(--line);position:relative;overflow:hidden;padding:0}
.thumb .lbl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:var(--mut);letter-spacing:.5px}
[data-anim]{width:100%;height:100%}[data-anim] svg{width:100%;height:100%;display:block}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.chip.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chip.on{border-color:var(--acc);color:var(--acc2)}
.target{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 10px;background:var(--card2);border-radius:12px;font-size:13px}
.target input{width:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-weight:700}
.target .sug{margin-left:auto;font-size:11px;color:var(--mut);text-align:right;line-height:1.3}
.target .sug.up{color:var(--ok)}
.sets{margin-top:10px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.set .n{font-size:12px;color:var(--mut);font-weight:600;text-align:center}
.set input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;font-weight:600}
.set.ok input{border-color:#2f6b52;color:var(--ok)}
.set .chk{height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:18px;color:var(--mut)}
.set.ok .chk{background:var(--ok);border-color:var(--ok);color:#0b2a1d}
.sethdr{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;font-size:10px;color:var(--mut);text-align:center;letter-spacing:.5px;text-transform:uppercase}
.last{font-size:11px;color:var(--mut);margin-top:8px}
/* forms */
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;text-transform:none;letter-spacing:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;text-align:center;margin-top:10px}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.ghost{background:none}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:0}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--mut);font-size:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--bebas);font-size:26px;font-weight:400;line-height:1.1}
.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat b.up{color:var(--acc2)}.stat b.down{color:var(--ok)}
.chart{width:100%;height:150px;background:var(--card2);border-radius:14px;border:1px solid var(--line);display:block}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow span{color:var(--mut)}
.x{color:var(--mut);font-size:16px;padding:2px 6px}
.banner{background:var(--bannerbg);border:1px solid var(--bannerline);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.4}
.banner b{color:var(--acc2)}
/* history */
.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.wk>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.wk .wt{flex:1}
.wk .wt b{display:block;font-size:15px}
.wk .wt span{font-size:12px;color:var(--mut)}
.wk .dots{display:flex;gap:3px}
.wk .dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.wk .dots i.on{background:var(--ok)}
.wk .body{display:none;padding:0 14px 12px}
.wk.open .body{display:block}
.wday{border-top:1px solid var(--line);padding:10px 0}
.wday .dh{font-weight:700;font-size:13px;margin-bottom:4px}
.wday .dh span{color:var(--mut);font-weight:500}
.wex{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
.wex span{color:var(--mut);text-align:right}
/* photos */
.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pslot{aspect-ratio:3/4;border-radius:12px;background:var(--card2);border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mut);overflow:hidden;position:relative;padding:0;width:100%}
.pslot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pslot.has{border-style:solid}
.pslot .pl{position:absolute;left:0;right:0;bottom:0;padding:4px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-weight:600;z-index:1}
.pslot .plus{font-size:24px;color:var(--acc2)}
.month{margin-top:14px}
.month .mh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.month .mh span{color:var(--mut);font-weight:500}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cmp figure{margin:0;background:var(--card2);border-radius:12px;overflow:hidden;aspect-ratio:3/4;position:relative}
.cmp img{width:100%;height:100%;object-fit:cover}
.cmp figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:600}
.cmp .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);font-size:12px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);background:var(--navbg);border-top:1px solid var(--line);display:flex;z-index:25;backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
/* rest bar */
#rest{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb));padding:10px 14px;background:var(--navbg);border-top:1px solid var(--line);transform:translateY(calc(100% + var(--nav) + var(--sb) + 10px));transition:transform .25s;z-index:24;backdrop-filter:blur(8px)}
#rest.show{transform:none}
#rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#rest .t{font-family:var(--bebas);font-size:40px;line-height:1;min-width:84px}
#rest .l{flex:1;min-width:0}
#rest .l small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest .pb{height:5px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}
#rest .pb i{display:block;height:100%;background:var(--acc)}
#rest button{padding:9px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700}
#rest.go .t{color:var(--ok)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}
.ov.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:31;padding:8px 16px calc(26px + var(--sb));transform:translateY(105%);transition:transform .25s}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.xbtn{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:14px;z-index:2}
.sheet h3{font-family:var(--bebas);font-weight:400;font-size:26px;margin:0 0 4px;letter-spacing:.5px;padding-right:40px}
.sheet .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.sheet .in{max-width:560px;margin:0 auto}
.opt{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--acc)}
.opt .thumb{width:64px;height:64px}
.opt b{display:block;font-size:15px;margin-bottom:3px}
.opt span{font-size:12px;color:var(--mut)}
.opt .cur{font-size:10px;font-weight:700;color:var(--acc2);letter-spacing:.5px}
.bigfig{background:var(--card2);border-radius:16px;border:1px solid var(--line);height:240px;margin-bottom:12px}
.bigimg{width:100%;border-radius:14px;display:block;max-height:65vh;object-fit:contain;background:#000}
.cues{margin:0;padding:0;list-style:none}
.cues li{padding:9px 0 9px 26px;border-bottom:1px solid var(--line);position:relative;font-size:14px;line-height:1.4}
.cues li:before{content:"✓";position:absolute;left:4px;color:var(--acc2);font-weight:700}
.tempo{font-size:12px;color:var(--mut);margin:10px 0 0}
/* pacer */
#pacer{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;align-items:center;padding:calc(20px + var(--st)) 16px calc(20px + var(--sb))}
#pacer.show{display:flex}
#pacer .pn{font-size:13px;color:var(--mut);text-align:center}
#pacer .pt{font-weight:700;font-size:18px;text-align:center;margin-top:2px}
#pacer .pfig{width:100%;max-width:380px;flex:1;min-height:180px;max-height:330px;margin:10px 0}
#pacer .pfig svg{width:100%;height:100%}
#pacer .phase{font-family:var(--bebas);font-size:46px;letter-spacing:1px;line-height:1;color:var(--acc);text-align:center}
#pacer .phase.hold{color:var(--warn)}
#pacer .phase.up{color:var(--ok)}
#pacer .pbar{width:100%;max-width:380px;height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
#pacer .pbar i{display:block;height:100%;background:var(--txt)}
#pacer .reps{font-family:var(--bebas);font-size:76px;line-height:1}
#pacer .reps small{font-size:30px;color:var(--mut)}
#pacer .pbtns{display:flex;gap:10px;width:100%;max-width:380px;margin-top:14px}
#pacer .pbtns button{flex:1;padding:15px;border-radius:14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
#pacer .pbtns button.main{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#pacer .tempoctl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:6px}
#pacer .tempoctl button{padding:4px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-weight:700}
/* profile picker */
#picker{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:#000}
#picker.show{display:flex}
#picker .half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;transition:flex .45s cubic-bezier(.7,0,.3,1),opacity .3s;padding:0 20px}
#picker .half b{font-family:var(--bebas);font-weight:400;font-size:64px;letter-spacing:6px;line-height:.9}
#picker .half span{font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:600;opacity:.85}
#picker .half small{font-size:11px;opacity:.6;margin-top:4px}
#picker .crown{width:60px;height:46px}
#picker .crown svg{width:100%;height:100%}
#picker .king{background:radial-gradient(120% 90% at 50% 0%,#2b230f 0%,#0a0a0a 60%);color:#d4af37;padding-top:var(--st)}
#picker .king b{background:linear-gradient(180deg,#f7e08a,#c9a02e 55%,#8a6a16);-webkit-background-clip:text;background-clip:text;color:transparent}
#picker .king:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(212,175,55,.05) 0 2px,transparent 2px 14px)}
#picker .qxeen{background:radial-gradient(120% 90% at 50% 100%,#7b2cd6 0%,#3b1466 45%,#160a26 100%);color:#f1dcff;padding-bottom:var(--sb)}
#picker .qxeen b{background:linear-gradient(180deg,#fff,#e1b8ff 60%,#b45cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#picker .qxeen .crown{color:#d9a6ff}
#picker .qxeen:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 1px,transparent 2px) 0 0/22px 22px}
#picker .half>*{position:relative}
#picker .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a0a0a;color:#f5efe0;border:1px solid #d4af37;box-shadow:0 0 0 1px #b45cff,0 8px 30px rgba(0,0,0,.6);padding:9px 18px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:2px;white-space:nowrap;transition:opacity .2s}
#picker.pick-king .qxeen,#picker.pick-qxeen .king{flex:0;opacity:0}
#picker.pick-king .who,#picker.pick-qxeen .who{opacity:0}
#picker.pick-king,#picker.pick-qxeen{animation:pkout .35s .45s forwards}
@keyframes pkout{to{opacity:0}}
.swbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.swbtn svg{width:20px;height:16px}

/* ===== feature pack ===== */
textarea.note{width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;resize:none;color:var(--txt);min-height:38px;overflow:hidden}
.acc2{color:var(--acc2)}
.cbtn{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:700;flex:none;display:inline-flex;align-items:center;justify-content:center}
.cbtn:disabled{opacity:.3}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 4px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--onacc)}
#pbar{display:flex;gap:6px;margin:12px 0 0}
#pbar button{flex:1;padding:10px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
#pbar button.king.on{background:#d4af37;color:#17120a;border-color:#d4af37}
#pbar button.qxeen.on{background:#b45cff;color:#fff;border-color:#b45cff}
#rother{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--sb) + 10px);z-index:26;background:var(--card);border:1.5px solid var(--c,var(--acc));color:var(--txt);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);white-space:nowrap}
#rother.up{bottom:calc(var(--nav) + var(--sb) + 78px)}
.nud{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.4}
.nud.both{border-left-color:#3ecf8e}
.nud b{color:var(--acc2)}
.streaks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
.streaks span{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.streaks b{color:var(--txt)}.streaks small{opacity:.7}
.streaks .vs{margin-left:auto}
/* PR celebration */
#pr{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#pr.show{opacity:1;pointer-events:auto}
#pr.hide{display:none}
.prbox{background:var(--card);border:2px solid var(--acc);border-radius:22px;padding:22px 26px;text-align:center;max-width:86vw;box-shadow:0 0 60px color-mix(in srgb,var(--acc) 45%,transparent);animation:prpop .45s cubic-bezier(.2,1.6,.4,1)}
.prbox .trophy{font-size:54px;line-height:1}
.prbox b{display:block;font-family:var(--bebas);font-weight:400;font-size:30px;letter-spacing:1px;color:var(--acc);margin-top:6px}
.prbox span{font-size:14px;color:var(--txt)}
@keyframes prpop{from{transform:scale(.6);opacity:0}}
#conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105%;transform:rotate(720deg)}}
/* warm-up & plates */
.wu{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.wu .wn{width:24px;height:24px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.wu b{flex:1}.wu .wp{font-size:12px;color:var(--mut)}
.wu .wc{opacity:0;color:var(--ok);font-weight:700}
.wu.done{border-color:#2f6b52}.wu.done .wc{opacity:1}.wu.done b{text-decoration:line-through;opacity:.6}
.wu.work{border-color:var(--acc)}
.bar-viz{display:flex;align-items:center;height:150px;background:var(--card2);border-radius:14px;padding:0 10px;overflow:hidden}
.bar-viz .shaft{flex:1;height:10px;background:#9a9aa2;border-radius:3px}
.bar-viz .sleeve{width:30px;height:16px;background:#b8b8c0;border-radius:3px}
.bar-viz i{display:block;border-radius:4px;margin-right:3px;box-shadow:inset -3px 0 0 rgba(0,0,0,.25)}
.bar-viz .collar{width:8px;height:30px;background:#c9c9d0;border-radius:2px;margin-right:4px}
.ptxt{margin-top:10px;font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pp{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--pc);color:#111;font-weight:700;font-size:13px}
/* scoreboard */
.score .sc-h,.score .sc-r{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;text-align:center;padding:9px 0;border-bottom:1px solid var(--line)}
.score .sc-r span{font-size:12px;color:var(--mut)}
.score .sc-r b{font-family:var(--bebas);font-weight:400;font-size:28px;color:var(--mut)}
.score .sc-r b.lead{color:var(--txt)}
.score .sc-r b.lead:after{content:" 👑";font-size:14px}
.kq{font-weight:800;font-size:13px}.kq.k{color:#d4af37}.kq.q{color:#c58bff}
.sc-f{text-align:center;padding-top:12px;font-weight:700}
/* measurements */
.mrow{width:100%;text-align:left}
.mrow span:last-child{min-width:70px;text-align:right}
.down{color:var(--ok)!important}.upc{color:var(--acc2)!important}
/* photo slider */
.sldwrap{margin-top:10px}
.sld{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.sld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.sld-top{position:absolute;inset:0}
.sld-line{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(0,0,0,.6)}
.sld-line i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.sl{position:absolute;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:8px}
.sl.a{left:8px}.sl.b{right:8px}
/* camera */
#cam{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;padding:var(--st) 0 var(--sb)}
#cam.hide{display:none}
.cam-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;color:#fff}
.cam-view{position:relative;flex:1;overflow:hidden}
.cam-view video,.cam-view #camG,.cam-view #camShot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-view #camG{pointer-events:none;mix-blend-mode:screen}
.cam-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.18) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.18) 66.6%,transparent 66.8%)}
#camCount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--bebas);font-size:140px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);pointer-events:none}
.cam-ctl{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:#000}
.ghostctl{display:flex;align-items:center;gap:10px;color:#ccc;font-size:12px}
.ghostctl input{flex:1;accent-color:var(--acc)}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--acc);align-self:center}
/* fuel */
.fdate{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.frings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fring{position:relative;text-align:center}
.fring svg{width:100%;max-width:80px;display:block;margin:0 auto}
.fring .fv{position:absolute;top:0;left:0;right:0;height:min(80px,100%);aspect-ratio:1;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:80px}
.fring .fv b{font-size:13px;line-height:1.1}
.fring .fv small{font-size:9px;color:var(--mut)}
.fring .fl{font-size:11px;color:var(--mut);margin-top:4px}
.fq{padding:12px 14px}
.fqh{display:flex;align-items:center;gap:10px}
.fqh b{flex:1}
.fqh input{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:700}
.fqh .muted{font-size:11px;width:70px}
.fq .chips{margin-top:8px}
.fbar{height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--acc)}
.swsearch{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;margin-bottom:10px}
.swh{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--acc2);margin:14px 2px 8px}
.opt.hide,.swh.hide{display:none}
.opt .ot{flex:1;min-width:0}
.fav{flex:none;font-size:24px;line-height:1;color:var(--line);padding:8px 2px 8px 8px}
.fav.on{color:var(--acc)}
/* routine editor */
.edrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.edn{flex:1;min-width:0}.edn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edn span{font-size:11px;color:var(--mut)}
nav button{font-size:9.5px}

#toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translate(-50%,-150%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast.show{transform:translate(-50%,0)}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}
.hide{display:none!important}
/* ============ iOS skin: Liquid Glass ============ */
:root{--bebas:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;--ok:#30d158;--warn:#ffd60a;--nav:76px;
 --glass:rgba(40,40,44,.55);--glass-b:rgba(255,255,255,.16);--fill:rgba(118,118,128,.24);--blur:blur(28px) saturate(180%);--lift:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:16px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(95% 55% at 10% -8%,color-mix(in srgb,var(--acc) 34%,transparent),transparent 70%),
 radial-gradient(70% 45% at 105% 28%,color-mix(in srgb,var(--acc2) 15%,transparent),transparent 70%),
 radial-gradient(85% 50% at -5% 100%,color-mix(in srgb,var(--acc) 13%,transparent),transparent 70%)}
button{transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(.96);opacity:.85}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)!important}
/* type */
h1{font-weight:800;font-size:clamp(26px,7.6vw,32px);letter-spacing:-.035em;line-height:1.05}
.dayhead h2{font-weight:700;font-size:24px;letter-spacing:-.025em;line-height:1.1}
.card h3{font-weight:700;font-size:19px;letter-spacing:-.02em}
.sheet h3{font-weight:700;font-size:22px;letter-spacing:-.025em}
.name{font-weight:650;letter-spacing:-.02em}
.num,.swh,.opt .cur{letter-spacing:.05em}
.stat b{font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sync{font-size:12px}.foot{font-size:12px}
/* surfaces */
.card,.wk{border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.card.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.pill{background:var(--fill);border:0;font-weight:600}
.banner{border-radius:20px}
.nud{background:var(--fill);border:0;border-radius:18px;padding:12px 14px}
.streaks span{background:var(--fill);border:0}
.stat{background:var(--fill);border-radius:16px}
.chart,.hist{background:rgba(0,0,0,.22);border:0;border-radius:18px}
.thumb{background:rgba(0,0,0,.28);border:0;border-radius:18px}
.bigfig{background:rgba(0,0,0,.28);border:0;border-radius:22px}
.pslot{background:var(--fill);border-radius:16px}
.target{background:var(--fill);border-radius:14px}
/* controls */
.set input,.target input,.fld input,.fld select,.fld textarea,textarea.note,.swsearch,.fqh input{background:var(--fill);border:1px solid transparent;border-radius:12px}
.set.ok input{border-color:transparent;background:color-mix(in srgb,var(--ok) 16%,transparent)}
.set .chk{border-radius:50%;width:38px;justify-self:center;background:var(--fill);border:0}
.set.ok .chk{background:var(--ok);color:#00210b}
.chip{background:var(--fill);border:0;font-weight:600;padding:9px 14px;font-size:13px}
.chip.on{background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--acc2)}
.chip.acc{background:var(--acc);color:var(--onacc)}
.btn{border-radius:16px;background:var(--fill);border:0;font-weight:600;padding:15px}
.btn.acc{background:var(--acc)}
.btn.ghost{background:none;color:var(--acc2)}
.cbtn{background:var(--fill);border:0;border-radius:50%}
.xbtn{background:var(--fill);border:0}
.swbtn{background:linear-gradient(145deg,var(--acc2),var(--acc));border:0;color:var(--onacc);font-weight:700;font-size:14px;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.days button{border-radius:16px;background:var(--fill);border:0;padding:10px 0 9px}
.days button.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg{background:var(--fill);border:0;border-radius:12px;padding:2px}
.seg button{border-radius:10px;font-weight:600}
.seg button.on{background:rgba(255,255,255,.2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar,.fbar{background:var(--fill)}
.fav{color:rgba(255,255,255,.22)}
/* floating glass tab bar */
nav{left:12px;right:12px;bottom:calc(8px + var(--sb));height:64px;padding:6px;max-width:536px;margin:0 auto;border-radius:32px;background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lift)}
nav button{border-radius:26px;font-size:10px;font-weight:600;gap:2px}
nav button.on{background:rgba(255,255,255,.14);color:var(--acc)}
/* floating glass rest timer */
#rest{left:12px;right:12px;bottom:calc(var(--nav) + var(--sb) + 4px);max-width:536px;margin:0 auto;padding:12px 14px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lift)}
#rest .t{font-weight:700;font-size:32px;min-width:76px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#rest button{background:var(--fill);border:0;border-radius:50%;width:40px;height:40px;padding:0;font-size:11px}
#rest .pb{background:var(--fill)}
#rother{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-width:1px;box-shadow:var(--lift)}
#rother.up{bottom:calc(var(--nav) + var(--sb) + 84px)}
/* sheets and overlays */
.ov{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:rgba(30,30,34,.84);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:32px 32px 0 0;border-top:1px solid var(--glass-b);box-shadow:0 -10px 50px rgba(0,0,0,.5)}
.sheet .grab{width:36px;height:5px;background:rgba(255,255,255,.3)}
.opt{background:var(--fill);border:1px solid transparent;border-radius:18px}
.opt.on{border-color:var(--acc)}
.wu{background:var(--fill);border:1px solid transparent;border-radius:16px}
#toast{background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:999px;font-weight:600;box-shadow:var(--lift)}
.prbox{background:rgba(30,30,34,.9);border:1px solid var(--glass-b);border-radius:30px}
.prbox b{font-weight:800;font-size:22px;letter-spacing:-.02em}
/* pacer */
#pacer{background:var(--bg) radial-gradient(90% 50% at 50% -5%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%)}
#pacer .phase{font-weight:800;font-size:36px;letter-spacing:-.03em}
#pacer .reps{font-weight:800;font-size:68px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
#pacer .reps small{font-size:24px;font-weight:600;letter-spacing:-.01em}
#pacer .pbtns button{border-radius:18px;background:var(--fill);border:0;font-weight:600}
#pacer .pbtns button.main{background:var(--acc)}
#pacer .tempoctl button{background:var(--fill);border:0;border-radius:999px}
#pacer .pbar{background:var(--fill)}
#camCount{font-weight:800}
/* partner + scoreboard */
#pbar button{border-radius:14px;border:0;background:var(--fill);font-weight:600}
#pbar button.king.on{background:#ff9f0a;color:#1c1100}
#pbar button.qxeen.on{background:#bf5af2;color:#fff}
.kq.k{color:#ffb84d}.kq.q{color:#dc9bff}
.score .sc-r b{font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score .sc-r b.lead:after{content:""}
.thumb .lbl{display:none}
/* profile picker */
#picker .half{gap:8px}
#picker .half b{font-family:var(--bebas);font-weight:800;font-size:46px;letter-spacing:-.035em;line-height:1;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff}
#picker .half span{font-size:14px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.85;color:#fff}
#picker .half small{color:#fff;font-size:12px}
#picker .king{background:radial-gradient(130% 100% at 15% 0%,#ffb340 0%,#c46a00 22%,#4a2600 52%,#0a0500 86%,#000 100%)}
#picker .qxeen{background:radial-gradient(130% 100% at 85% 100%,#d38bff 0%,#9a3fd6 22%,#3c1560 54%,#0c0514 88%,#000 100%)}
#picker .king:before,#picker .qxeen:before{background:none}
#picker .mono{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:25px;letter-spacing:-.03em;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.25);margin-bottom:6px}
#picker .who{background:rgba(30,30,34,.55);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--lift);color:#fff;font-weight:600;font-size:13px;letter-spacing:0;padding:10px 18px}
/* ============ light mode ============ */
.cmp figcaption,.sl{color:#fff}
#cam{color:#fff}
#cam .chip,#cam .cbtn,#cam .btn{background:rgba(118,118,128,.34);color:#fff}
#cam .chip.on{background:rgba(255,255,255,.9);color:#000}
#cam .btn.acc{background:var(--acc);color:var(--onacc)}
[data-mode=light]{--glass:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.8);--fill:rgba(118,118,128,.13);--ok:#1f9d48;--warn:#b98500;--lift:0 10px 34px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9)}
[data-mode=light] body::before{opacity:.6}
[data-mode=light] .card,[data-mode=light] .wk{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
[data-mode=light] .card.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
[data-mode=light] .ov{background:rgba(0,0,0,.25)}
[data-mode=light] .sheet{background:rgba(246,246,250,.88);box-shadow:0 -10px 50px rgba(0,0,0,.18)}
[data-mode=light] .sheet .grab{background:rgba(60,60,67,.3)}
[data-mode=light] .sheet .opt,[data-mode=light] .sheet .wu{background:rgba(255,255,255,.8)}
[data-mode=light] .sheet .opt.on{border-color:var(--acc)}
[data-mode=light] .seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-mode=light] nav button.on{background:rgba(0,0,0,.07)}
[data-mode=light] .thumb,[data-mode=light] .bigfig,[data-mode=light] .chart,[data-mode=light] .hist{background:rgba(118,118,128,.1)}
[data-mode=light] .fav{color:rgba(60,60,67,.25)}
[data-mode=light] .fav.on{color:var(--acc)}
[data-mode=light] .prbox{background:rgba(255,255,255,.95)}
[data-mode=light] .set.ok .chk{color:#fff}
[data-mode=light] .kq.k{color:#b86200}
[data-mode=light] .kq.q{color:#8a36bd}
[data-mode=light] #pbar button.king.on{color:#2a1800}
[data-mode=light] .swbtn{box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
/* ============ live partner card ============ */
.live{background:var(--card);border-radius:22px;padding:12px 14px;margin-top:12px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 32%,transparent)}
.live.flash{animation:lvflash 1s ease}
@keyframes lvflash{0%{box-shadow:inset 0 0 0 2px var(--pc),0 0 0 0 color-mix(in srgb,var(--pc) 55%,transparent);transform:scale(1.015)}100%{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 32%,transparent),0 0 0 16px transparent;transform:none}}
.lv-top{display:flex;align-items:center;gap:10px}
.lv-av{width:38px;height:38px;border-radius:50%;background:var(--pc);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.02em}
.lv-t{flex:1;min-width:0}.lv-t b{display:flex;align-items:center;gap:7px;font-size:15px}.lv-t span{font-size:12px;color:var(--mut)}
.lv-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:lvp 1.6s infinite}
@keyframes lvp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.lv-hype{flex:none}
.lv-bar{height:6px;border-radius:6px;background:var(--fill);margin:11px 0 7px;overflow:hidden}
.lv-bar i{display:block;height:100%;background:var(--pc);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lv-sub{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.lvtag{color:var(--ok);font-weight:600}
.hyp{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.hyp i{position:absolute;bottom:-50px;font-style:normal;animation:hup 2.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes hup{to{transform:translateY(-112vh) rotate(20deg);opacity:0}}
/* ============ caffeine ============ */
.cafbtn{width:38px;height:38px;border-radius:50%;background:var(--fill);color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;padding:0;border:0}
.cafbtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cafbtn .steam{opacity:0}
.cafbtn.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.cafbtn.on .steam{opacity:1;animation:steam 2.4s ease-in-out infinite}
.cafbtn.warn{color:var(--warn)}
@keyframes steam{0%,100%{transform:translateY(1px);opacity:.35}50%{transform:translateY(-1.5px);opacity:1}}
/* ============ session timer ============ */
#sessBar:empty{display:none}
#sessBar{margin-top:12px}
.sess-idle{width:100%;padding:11px;border-radius:16px;background:var(--fill);color:var(--mut);font-weight:600;font-size:14px;border:1px dashed color-mix(in srgb,var(--acc) 40%,transparent)}
.sess{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent)}
.ss-ring{width:42px;height:42px;flex:none;transform:rotate(-90deg)}
.ss-ring circle{fill:none;stroke-width:4.5}
.ss-ring .bg{stroke:var(--fill)}
.ss-ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ss-t{flex:1;min-width:0}
.ss-t b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ss-t span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .cbtn{width:38px;height:38px;font-size:12px}
.sess .ss-add{width:auto;padding:0 10px;border-radius:19px}
.sess.pause .ss-t b{opacity:.55}
.sess.low{box-shadow:inset 0 0 0 1.5px var(--warn)}
.sess.low .fg{stroke:var(--warn)}
.sess.over{box-shadow:inset 0 0 0 1.5px #ff453a;animation:sover 1.2s ease-in-out infinite}
.sess.over .ss-t b{color:#ff453a}
@keyframes sover{50%{box-shadow:inset 0 0 0 1.5px #ff453a,0 0 22px rgba(255,69,58,.35)}}
.sess-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sess-presets .chip{padding:12px 0}
</style>
</head>
